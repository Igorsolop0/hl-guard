name: Release

# Publishes to PyPI with trusted publishing (OIDC): no API token is stored.
# See RELEASING.md for the one-time setup on PyPI and GitHub.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  pypi:
    name: build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/hl-guard/
    permissions:
      id-token: write
      contents: read
    env:
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check the tag name
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([a-z0-9.]*)$ ]]; then
            echo "::error::tag '$TAG' is not v<major>.<minor>.<patch>"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.9"
          python-version: "3.12"
      - name: Build
        run: uv build --out-dir dist
      - name: Check that the built wheel reports the tag's version
        run: |
          set -euo pipefail
          version="${TAG#v}"
          shopt -s nullglob
          wheels=(dist/hl_guard-*.whl)
          if [ "${#wheels[@]}" -ne 1 ] || [ "${wheels[0]}" != "dist/hl_guard-${version}-py3-none-any.whl" ]; then
            echo "::error::expected one wheel for ${version}, got: ${wheels[*]:-none}"
            exit 1
          fi
          test -f "dist/hl_guard-${version}.tar.gz"
          uv venv --python 3.12 "${RUNNER_TEMP}/wheel-check"
          # --version needs no dependencies; --no-deps keeps PyPI out of this job.
          uv pip install --no-deps --python "${RUNNER_TEMP}/wheel-check/bin/python" "${wheels[0]}"
          got="$("${RUNNER_TEMP}/wheel-check/bin/hl-guard" --version)"
          if [ "$got" != "hl-guard ${version}" ]; then
            echo "::error::the wheel prints '${got}', the tag ${TAG} needs 'hl-guard ${version}'"
            exit 1
          fi
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
