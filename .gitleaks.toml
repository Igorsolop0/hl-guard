title = "hl-guard gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "hex-private-key"
description = "64-hex-digit private key, as used for EVM wallets and agent keys"
regex = '''(?i)\b(?:0x)?[0-9a-f]{64}\b'''
entropy = 3.0

[[rules.allowlists]]
description = "sha256 package hashes in the root uv lockfile"
condition = "AND"
paths = ['''^uv\.lock$''']
regexTarget = "line"
regexes = ['''hash = "sha256:[0-9a-f]{64}"''']

[[rules.allowlists]]
description = "sha256 pin of the gitleaks release tarball in CI"
condition = "AND"
paths = ['''^\.github/workflows/ci\.yml$''']
regexTarget = "line"
regexes = ['''^\s*GITLEAKS_SHA256: [0-9a-f]{64}$''']
