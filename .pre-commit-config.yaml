repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: check-private-traces
        name: no personal traces
        entry: python tools/check_private_traces.py
        language: python
        types: []
        types_or: [file, symlink]
