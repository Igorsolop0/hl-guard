[project]
name = "hl-guard"
version = "0.1.0"
description = "A self-hosted MCP server that guards Hyperliquid orders with a user policy."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ihor Solopii" }]
requires-python = ">=3.11"
dependencies = [
    "coincurve>=20,<22",
    "eth-account>=0.13.7,<0.14",
    "mcp==2.3.0",
    "msgpack>=1.1,<2",
    "pyyaml>=6.0.3,<7",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
hl-guard = "hl_guard.cli.__main__:main"

[dependency-groups]
dev = [
    "hyperliquid-python-sdk==0.24.0",
    "mypy>=1.18",
    "pre-commit>=4",
    "pytest>=8",
    "ruff>=0.13",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tools", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[[tool.mypy.overrides]]
module = ["msgpack", "hyperliquid.*", "yaml"]
ignore_missing_imports = true
